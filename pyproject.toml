[project]
name = "simpulse"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dearpygui>=2.3.1",
    "sdl3>=0.2.0rc0",
    "glfw>=2.7.0",
    "pyside6>=6.11.2",
    "imgui-bundle>=1.92.900",
    "numpy>=2.5.2",
    "piper-tts>=1.2.0",
    "tqdm>=4.66.0",
    "isimotor-rawudp-client @ https://github.com/marcgardent/isiMotor-RawUDP-Plugin/releases/download/v0.3.0/isimotor_rawudp_client-0.3.0-py3-none-any.whl",
]

[project.scripts]
simpulse = "simpulse.app:main"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
# Started deliberately loose (no --strict): the goal right now is catching
# real "wrong object handed to a hook" bugs like the TelemetryStateStore vs.
# TelemetryView mismatch (SimPulsePlugin's on_* hooks, race_engineer's
# EngineerContext) — not chasing every untyped def in the Qt UI code.
# Tighten incrementally (disallow_untyped_defs, etc.) module by module instead
# of flipping it on globally.
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

# No type stubs published for the game-telemetry UDP client — silence the
# "no stubs" noise instead of ignoring the whole package. python_version 3.14
# lands on the interpreter this project already requires.
[[tool.mypy.overrides]]
module = "isimotor_rawudp_client.*"
ignore_missing_imports = true

