<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMU - Affichage Tête Haute (HUD)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Styling pour le conteneur du canvas pour garder le ratio */
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            background: #000000;
            border-radius: 0.25rem;
            border: 1px solid #1e293b;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Custom scrollbar pour le panneau de contrôle */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="mb-6 text-center md:text-left">
        <h1 class="text-3xl font-bold font-['Orbitron'] text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-orange-500">
            LMU - Télémétrie HUD
        </h1>
        <p class="text-slate-400 text-sm">Simulateur de tableau de bord en temps réel</p>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- HUD CANVAS (Left Side) -->
        <div class="lg:col-span-8 flex justify-center">
            <div class="canvas-container">
                <canvas id="hudCanvas" width="800" height="600"></canvas>
            </div>
        </div>

        <!-- CONTROL PANEL (Right Side) -->
        <div class="lg:col-span-4 bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700 h-full max-h-[800px] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4 font-['Orbitron'] border-b border-slate-600 pb-2">Contrôles IHM</h2>

            <div class="space-y-6">
                <!-- Vitesse et Rapport -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Transmission</h3>
                    <div>
                        <label class="flex justify-between text-sm mb-1">Vitesse (km/h) <span id="val-speed" class="text-blue-400">0</span></label>
                        <input type="range" id="ctrl-speed" min="0" max="350" value="0" class="w-full accent-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Rapport de boîte (Gear)</label>
                        <select id="ctrl-gear" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
                            <option value="R">Reverse (R)</option>
                            <option value="N" selected>Neutral (N)</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                        </select>
                    </div>
                </div>

                <!-- Pédales et Aéro -->
                <div class="space-y-3 pt-4 border-t border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Dynamique</h3>
                    <div>
                        <label class="flex justify-between text-sm mb-1">Accélérateur <span id="val-throttle" class="text-green-400">0%</span></label>
                        <input type="range" id="ctrl-throttle" min="0" max="100" value="0" class="w-full accent-green-500">
                    </div>
                    <div>
                        <label class="flex justify-between text-sm mb-1">Frein <span id="val-brake" class="text-red-400">0%</span></label>
                        <input type="range" id="ctrl-brake" min="0" max="100" value="0" class="w-full accent-red-500">
                    </div>
                    <div>
                        <label class="flex justify-between text-sm mb-1">Appui Aérodynamique <span id="val-aero" class="text-orange-400">50%</span></label>
                        <input type="range" id="ctrl-aero" min="0" max="100" value="50" class="w-full accent-orange-500">
                    </div>
                </div>

                <!-- Alertes & Indicateurs -->
                <div class="space-y-3 pt-4 border-t border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Alertes</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center space-x-2 cursor-pointer bg-slate-900 p-2 rounded border border-slate-700 hover:border-purple-500 transition">
                            <input type="checkbox" id="ctrl-overbrake" class="accent-purple-500 w-4 h-4">
                            <span class="text-sm">Surfreinage</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer bg-slate-900 p-2 rounded border border-slate-700 hover:border-yellow-500 transition">
                            <input type="checkbox" id="ctrl-wheelspin" class="accent-yellow-500 w-4 h-4">
                            <span class="text-sm">Surpatinage</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer bg-slate-900 p-2 rounded border border-slate-700 hover:border-white transition">
                            <input type="checkbox" id="ctrl-underrev" class="accent-white w-4 h-4">
                            <span class="text-sm">Sous-régime</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer bg-slate-900 p-2 rounded border border-slate-700 hover:border-white transition">
                            <input type="checkbox" id="ctrl-overrev" class="accent-white w-4 h-4">
                            <span class="text-sm">Sur-régime</span>
                        </label>
                    </div>
                </div>

                <!-- Chronométrage -->
                <div class="space-y-3 pt-4 border-t border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Course & Chrono</h3>
                    <div>
                        <label class="block text-sm mb-1">Delta (Expected)</label>
                        <input type="text" id="ctrl-expected" value="-0.150" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm font-['Orbitron']">
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <div>
                            <label class="block text-xs mb-1 text-slate-400">Énergie (Tours)</label>
                            <input type="number" step="0.1" id="ctrl-energy" value="2.4" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs mb-1 text-slate-400">Tours restants</label>
                            <input type="number" step="1" id="ctrl-laps" value="5" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm">
                        </div>
                    </div>

                    <div class="space-y-2 mt-2">
                        <!-- Secteur 1 -->
                        <div class="flex items-center space-x-2">
                            <span class="text-xs w-6 text-slate-400">S1</span>
                            <input type="text" id="ctrl-s1-time" value="32.410" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs">
                            <select id="ctrl-s1-status" class="bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs w-24">
                                <option value="default">Normal</option>
                                <option value="green">Vert</option>
                                <option value="purple">Violet</option>
                                <option value="invalid">Invalide</option>
                            </select>
                        </div>
                        <!-- Secteur 2 -->
                        <div class="flex items-center space-x-2">
                            <span class="text-xs w-6 text-slate-400">S2</span>
                            <input type="text" id="ctrl-s2-time" value="1:14.200" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs">
                            <select id="ctrl-s2-status" class="bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs w-24">
                                <option value="default">Normal</option>
                                <option value="green">Vert</option>
                                <option value="purple">Violet</option>
                                <option value="invalid">Invalide</option>
                            </select>
                        </div>
                        <!-- Secteur 3 -->
                        <div class="flex items-center space-x-2">
                            <span class="text-xs w-6 text-slate-400">S3</span>
                            <input type="text" id="ctrl-s3-time" value="--" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs">
                            <select id="ctrl-s3-status" class="bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs w-24">
                                <option value="default">Normal</option>
                                <option value="green">Vert</option>
                                <option value="purple">Violet</option>
                                <option value="invalid">Invalide</option>
                            </select>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // Configuration du Canvas
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        // État global de la télémétrie
        const state = {
            speed: 0,
            gear: 'N',
            throttle: 0,
            brake: 0,
            aero: 50,
            overbrake: false,
            wheelspin: false,
            underrev: false,
            overrev: false,
            expectedTime: "-0.150",
            energyLaps: 2.4,
            remainingLaps: 5,
            sectors: [
                { time: "32.410", status: "default" },
                { time: "52.140", status: "default" },
                { time: "--", status: "default" }
            ]
        };

        // Valeurs lissées pour les jauges (pour une animation fluide)
        const display = {
            throttle: 0,
            brake: 0,
            aero: 50,
            speed: 0
        };

        // Lier les inputs UI à l'état
        function setupUI() {
            const bindInput = (id, stateKey, displayId, suffix = '') => {
                const el = document.getElementById(id);
                const disp = document.getElementById(displayId);
                el.addEventListener('input', (e) => {
                    const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                    state[stateKey] = e.target.type === 'number' || e.target.type === 'range' ? parseFloat(val) : val;
                    if(disp) disp.innerText = val + suffix;
                });
            };

            bindInput('ctrl-speed', 'speed', 'val-speed');
            bindInput('ctrl-gear', 'gear');
            bindInput('ctrl-throttle', 'throttle', 'val-throttle', '%');
            bindInput('ctrl-brake', 'brake', 'val-brake', '%');
            bindInput('ctrl-aero', 'aero', 'val-aero', '%');

            bindInput('ctrl-overbrake', 'overbrake');
            bindInput('ctrl-wheelspin', 'wheelspin');
            bindInput('ctrl-underrev', 'underrev');
            bindInput('ctrl-overrev', 'overrev');
            bindInput('ctrl-expected', 'expectedTime');
            bindInput('ctrl-energy', 'energyLaps');
            bindInput('ctrl-laps', 'remainingLaps');

            // Sectors setup
            for(let i=1; i<=3; i++) {
                document.getElementById(`ctrl-s${i}-time`).addEventListener('input', (e) => {
                    state.sectors[i-1].time = e.target.value;
                });
                document.getElementById(`ctrl-s${i}-status`).addEventListener('change', (e) => {
                    state.sectors[i-1].status = e.target.value;
                });
            }
        }

        function drawRoundedRect(x, y, width, height, radius, fillStyle, strokeStyle, lineWidth = 2) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();

            if (fillStyle) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }
            if (strokeStyle) {
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeStyle;
                ctx.stroke();
            }
        }

        // Interpolation pour animation fluide des barres
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function renderHUD() {
            // Effacer le canvas avec le fond plat
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Mettre à jour les valeurs d'affichage fluides
            display.throttle = lerp(display.throttle, state.throttle, 0.15);
            display.brake = lerp(display.brake, state.brake, 0.15);
            display.aero = lerp(display.aero, state.aero, 0.05);
            display.speed = Math.round(lerp(display.speed, state.speed, 0.2));

            const centerX = WIDTH / 2;
            const centerY = HEIGHT / 2;

            // --- JAUGE FREIN (Gauche) ---
            const gaugeWidth = 35;
            const gaugeHeight = 280;
            const brakeX = centerX - 260;
            const gaugeY = centerY - gaugeHeight/2 + 30;

            // Fond jauge frein (Plat)
            drawRoundedRect(brakeX, gaugeY, gaugeWidth, gaugeHeight, 0, '#111827');
            // Remplissage jauge frein
            const brakeFillHeight = (display.brake / 100) * gaugeHeight;
            if(brakeFillHeight > 0) {
                ctx.fillStyle = state.overbrake ? '#a855f7' : '#ef4444'; // Violet si surfreinage, sinon rouge
                ctx.fillRect(brakeX, gaugeY + gaugeHeight - brakeFillHeight, gaugeWidth, brakeFillHeight);
            }

            // --- JAUGE ACCÉLÉRATEUR (Droite) ---
            const throttleX = centerX + 260 - gaugeWidth;

            // Fond jauge accel
            drawRoundedRect(throttleX, gaugeY, gaugeWidth, gaugeHeight, 0, '#111827');
            // Remplissage jauge accel
            const throttleFillHeight = (display.throttle / 100) * gaugeHeight;
            if(throttleFillHeight > 0) {
                ctx.fillStyle = state.wheelspin ? '#eab308' : '#22c55e'; // Jaune si patinage, sinon vert
                ctx.fillRect(throttleX, gaugeY + gaugeHeight - throttleFillHeight, gaugeWidth, throttleFillHeight);
            }

            // --- CENTRE: RAPPORT (GEAR) ---
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 200px "Orbitron", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(state.gear, centerX, centerY + 20);

            // --- CENTRE: VITESSE (Juste en dessous du gear, sans légende) ---
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 70px "Rajdhani", sans-serif';
            ctx.fillText(display.speed, centerX, centerY + 160);

            // --- INDICATEUR SOUS-REGIME (Triangle Gauche plat) ---
            if (state.underrev) {
                ctx.beginPath();
                ctx.moveTo(centerX - 130, centerY + 20);
                ctx.lineTo(centerX - 90, centerY - 10);
                ctx.lineTo(centerX - 90, centerY + 50);
                ctx.closePath();
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // --- INDICATEUR SUR-REGIME (Triangle Droite plat) ---
            if (state.overrev) {
                ctx.beginPath();
                ctx.moveTo(centerX + 130, centerY + 20);
                ctx.lineTo(centerX + 90, centerY - 10);
                ctx.lineTo(centerX + 90, centerY + 50);
                ctx.closePath();
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // --- BARRE AERO (En bas, bleu = 0%, orange = 100%) ---
            const aeroWidth = 460;
            const aeroHeight = 20;
            const aeroX = centerX - aeroWidth/2;
            const aeroY = centerY + 230;

            // Cadre aero
            drawRoundedRect(aeroX, aeroY, aeroWidth, aeroHeight, 0, '#111827');

            // Calcul couleur Aéro linéaire plat
            const a = display.aero / 100;
            const r = Math.round(lerp(59, 249, a)); // 59 -> 249 (Bleu vers Orange)
            const g = Math.round(lerp(130, 115, a));
            const b = Math.round(lerp(246, 22, a));

            const aeroFillWidth = (display.aero / 100) * aeroWidth;
            if (aeroFillWidth > 0) {
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.fillRect(aeroX, aeroY, aeroFillWidth, aeroHeight);
            }

            // --- DELTA EXPECTED (En haut au centre) ---
            const isNegativeDelta = String(state.expectedTime).startsWith('-');
            ctx.fillStyle = isNegativeDelta ? '#22c55e' : (state.expectedTime === '--' ? '#ffffff' : '#ef4444');
            ctx.font = 'bold 56px "Orbitron", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.expectedTime, centerX, 70);

            // --- ENERGIE / TOURS RESTANTS (En haut à droite) ---
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Orbitron", sans-serif';
            ctx.textAlign = 'right';
            const energyValue = parseFloat(state.energyLaps).toFixed(1);
            ctx.fillText(`${energyValue} / ${state.remainingLaps}`, WIDTH - 30, 50);

            ctx.font = 'bold 12px "Rajdhani", sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText("ÉNERGIE / TOURS", WIDTH - 30, 70);

            // --- SECTEURS (Juste sous le delta) ---
            const sectorWidth = 100;
            const sectorHeight = 40;
            const sectorSpacing = 10;
            const totalSectorWidth = (sectorWidth * 3) + (sectorSpacing * 2);
            const startSectorX = centerX - totalSectorWidth/2;
            const sectorY = 110;

            for (let i = 0; i < 3; i++) {
                const sX = startSectorX + (i * (sectorWidth + sectorSpacing));
                const sector = state.sectors[i];

                let bgColor = '#1e293b'; // par défaut
                let strokeColor = '#334155';

                if (sector.status === 'invalid') {
                    bgColor = '#000000';
                } else if (sector.status === 'green') {
                    bgColor = '#16a34a';
                    strokeColor = '#16a34a';
                } else if (sector.status === 'purple') {
                    bgColor = '#9333ea';
                    strokeColor = '#9333ea';
                }

                drawRoundedRect(sX, sectorY, sectorWidth, sectorHeight, 0, bgColor, strokeColor, 1);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px "Rajdhani", sans-serif';
                ctx.fillText(sector.time, sX + sectorWidth/2, sectorY + 28);
            }

            // Boucle d'animation
            requestAnimationFrame(renderHUD);
        }

        // Initialisation
        setupUI();
        renderHUD();

    </script>
</body>
</html>
